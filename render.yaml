services:
  - type: web
    name: paro-es2-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: paro-es2-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: paro-es2-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: paro-es2-db
    plan: free
    databaseName: paro
    user: paro_user
